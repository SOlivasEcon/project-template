# Builds the project from scratch and runs the tests on Windows and macOS.
# Python, R and Julia tasks run; Stata and Matlab need licenses, so their tasks are skipped here.
#
# Runs only when you ask: GitHub > Actions > CI > "Run workflow". On a private repo each run uses about 75 of the
# monthly free Actions minutes (macOS minutes count 10x). To run it on every push and pull request instead, add
# `push:` and `pull_request:` lines under `on:` below.
name: CI

on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: prefix-dev/setup-pixi@v0.11.2
        with:
          pixi-version: v0.83.0
          locked: true            # fail if pixi.lock is out of date with pyproject.toml

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release

      - uses: julia-actions/setup-julia@v3
        with:
          version: "1"

      - name: Write .env
        run: echo "OUTPUT_ROOT=${{ runner.temp }}/output" > .env

      - name: Build
        run: pixi run build

      - name: Check that the committed paper tables match the build
        run: git diff --exit-code paper/generated/tables

      - name: Test
        run: pixi run test

      - name: Task graph
        run: pixi run task-graph

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.11.2
        with:
          pixi-version: v0.83.0
          locked: true
      - name: pre-commit checks
        run: pixi run pre-commit run --all-files
